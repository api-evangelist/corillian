name: Corillian
description: >-
  Corillian Corporation was a leading provider of Internet banking software and
  services, headquartered in Hillsboro, Oregon. The company was formed in 1997
  when CheckFree spun off InteractiveSolutions Corporation, and it went on to
  build the Corillian Voyager online banking platform used by many U.S. banks
  and credit unions for online banking, bill payment, and real-time financial
  services integration. Backed by Battery Ventures, Corillian became a public
  company and expanded through the acquisitions of InteliData Technologies
  (2005) and qbt Systems (2006). In February 2007 CheckFree agreed to acquire
  Corillian for approximately $245 million; CheckFree was itself acquired by
  Fiserv later that same year, after which the Corillian brand was retired. The
  company no longer operates independently and maintains no public API,
  developer portal, documentation, or other live developer surface.
